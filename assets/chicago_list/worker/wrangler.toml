# Cloudflare Worker behind the Chicago map's chat widget. It holds the Gemini and Groq
# API keys so the static page never has to, and builds the whole prompt from the sheet itself.
#
#   bash assets/chicago_list/worker/deploy.sh       # sets the secrets and deploys
#
# The deployed URL goes in WORKER_URL at the top of ../chicagoChat.js.

name = "chicago-chat"
main = "worker.js"
compatibility_date = "2026-08-01"

# Free-plan defaults: keep observability on so a failing question shows up in the
# dashboard's Logs tab rather than as a silent error in the widget.
[observability]
enabled = true

[vars]
# The default model, used when the page sends nothing or sends an id that is not in
# ALLOWED_MODELS in worker.js — that list, not this setting, is what stops a leaked
# endpoint being pointed at an expensive model. An id starting with "gemini-" goes to
# Gemini, anything else to Groq.
#   https://ai.google.dev/gemini-api/docs/models
#   https://console.groq.com/docs/models
MODEL = "openai/gpt-oss-120b"

# Only these origins may POST. Add a port here if you serve the site locally another way.
ALLOWED_ORIGINS = "https://allendufort.github.io,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500"

# Fallback place data for the rare case where the Google Sheet is unreachable.
SNAPSHOT_URL = "https://allendufort.github.io/portfolio/assets/chicago_list/chicago_layers.geojson"
