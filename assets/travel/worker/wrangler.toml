# Cloudflare Worker behind the Travel Planner page. Holds the Anthropic API key
# so the static page never has to.
#
#   bash assets/travel/worker/deploy.sh        # sets the secret and deploys
#
# The deployed URL goes in WORKER_URL at the top of ../travel.js.

name = "travel-planner"
main = "worker.js"
compatibility_date = "2026-08-01"

[observability]
enabled = true

[vars]
# Pinned server-side. See https://docs.anthropic.com/en/docs/about-claude/models
MODEL = "claude-haiku-4-5"

# Origins allowed to POST. Add localhost ports you use locally.
ALLOWED_ORIGINS = "https://allendufort.github.io,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500"
